name: trust
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  trust:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: CorvidLabs Trust gate
        id: trust
        uses: CorvidLabs/trust@a239f78658e5ad0f12fa230f494890e40c6e4d7b # v1.1.1
